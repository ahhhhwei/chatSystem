<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1000 470" width="100%" height="100%">
  <defs>
    <style>
      .stroke-black { stroke: #000000; stroke-width: 1.5; fill: none; }
      .stroke-dashed { stroke: #000000; stroke-width: 1.5; stroke-dasharray: 4 4; fill: none; }
      .fill-white { fill: #ffffff; stroke: #000000; stroke-width: 1.5; }
      .text-black { font-family: 'PingFang SC', 'Microsoft YaHei', 'Helvetica Neue', sans-serif; font-size: 15px; fill: #000000; }
      .text-small { font-family: 'PingFang SC', 'Microsoft YaHei', sans-serif; font-size: 13px; fill: #000000; }
      .text-center { text-anchor: middle; }
      .text-end { text-anchor: end; }
      .text-start { text-anchor: start; }
    </style>
    <marker id="arrow" markerWidth="10" markerHeight="7" refX="8" refY="3.5" orient="auto">
      <polygon points="0 0, 10 3.5, 0 7" fill="#000000"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#ffffff"/>

  <rect x="525" y="20" width="130" height="50" rx="5" class="fill-white" />
  <text x="590" y="51" class="text-black text-center">注册中心</text>

  <ellipse cx="120" cy="250" rx="55" ry="28" class="fill-white" />
  <text x="120" y="255" class="text-black text-center">客户端</text>

  <rect x="450" y="160" width="55" height="190" class="fill-white" />
  <text x="477.5" y="260" class="text-black text-center">网关</text>

  <rect x="660" y="130" width="160" height="55" rx="10" class="fill-white" />
  <text x="740" y="163" class="text-black text-center">用户管理子服务</text>

  <rect x="660" y="315" width="160" height="55" rx="10" class="fill-white" />
  <text x="740" y="348" class="text-black text-center">好友管理子服务</text>

  <path d="M 485 160 L 535 78" class="stroke-dashed" marker-end="url(#arrow)" />
  <text x="475" y="115" class="text-small text-end">服务发现</text>

  <path d="M 680 130 L 625 78" class="stroke-dashed" marker-end="url(#arrow)" />
  <text x="670" y="105" class="text-small text-start">服务注册</text>

  <path d="M 680 315 L 600 78" class="stroke-dashed" marker-end="url(#arrow)" />
  <text x="650" y="230" class="text-small text-start">服务注册</text>

  <path d="M 175 225 L 440 225" class="stroke-black" marker-end="url(#arrow)" />
  <text x="305" y="215" class="text-black text-center">用户注册</text>

  <path d="M 175 275 L 440 275" class="stroke-black" marker-end="url(#arrow)" />
  <text x="305" y="300" class="text-black text-center">好友申请</text>

  <path d="M 505 195 L 650 160" class="stroke-black" marker-end="url(#arrow)" />
  <path d="M 660 175 L 515 210" class="stroke-black" marker-end="url(#arrow)" />

  <path d="M 505 305 L 650 340" class="stroke-black" marker-end="url(#arrow)" />
  <path d="M 660 350 L 515 315" class="stroke-black" marker-end="url(#arrow)" />

  <g transform="translate(850, 105)">
    <text x="0" y="20" class="text-black">用户注册</text>
    <text x="0" y="45" class="text-black">用户登录</text>
    <text x="0" y="70" class="text-black">个人信息修改</text>
    <text x="0" y="95" class="text-black">个人信息获取</text>
    <text x="0" y="120" class="text-black">....</text>
  </g>

  <g transform="translate(850, 290)">
    <text x="0" y="20" class="text-black">好友的申请</text>
    <text x="0" y="45" class="text-black">好友的删除</text>
    <text x="0" y="70" class="text-black">好友申请的处理</text>
    <text x="0" y="95" class="text-black">聊天会话的管理</text>
    <text x="0" y="120" class="text-black">好友列表的获取</text>
    <text x="0" y="145" class="text-black">...</text>
  </g>
</svg>
