syntax = "proto3";

package ahwei_im;

import "base.proto";

option cc_generic_services = true;

message GetHistoryMsgReq {
    string request_id = 1;
    string chat_session_id = 2;
    int64 start_time = 3;
    int64 over_time = 4;
    string user_id = 5;
    string session_id = 6;
}

message GetHistoryMsgRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3;
    // repeated 表示数组
    repeated MessageInfo msg_list = 4;
}

message GetRecentMsgReq {
    string request_id = 1;
    string chat_session_id = 2;
    int64 msg_count = 3;
    int64 cur_time = 4;
    string user_id = 5;
    string session_id = 6;
}

message GetRecentMsgRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3;
    repeated MessageInfo msg_list = 4;
}

message MsgSearchReq {
    string request_id = 1;
    string user_id = 2;
    string session_id = 3;
    string chat_session_id = 4;
    string search_key = 5;
}

message MsgSearchRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3;
    repeated MessageInfo msg_list = 4;
}

// V2 独立联调时使用的内部投递接口。
// 后续接入 RabbitMQ 后，MessageTransmitServer 可以换用 MQ publisher，
// 对外的消息查询协议不受影响。
message StoreMessageReq {
    string request_id = 1;
    MessageInfo message = 2;
}

message StoreMessageRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3;
}

service MsgStorageService {
    rpc GetHistoryMsg(GetHistoryMsgReq) returns (GetHistoryMsgRsp);
    rpc GetRecentMsg(GetRecentMsgReq) returns (GetRecentMsgRsp);
    rpc MsgSearch(MsgSearchReq) returns (MsgSearchRsp);
    rpc StoreMessage(StoreMessageReq) returns (StoreMessageRsp);
}
