syntax = "proto3";

package ahwei_im;

import "base.proto";

option cc_generic_services = true;

message GetFriendListReq {
    string request_id = 1;
    string user_id = 2;
    string session_id = 3;
}

message GetFriendListRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3;
    repeated UserInfo friend_list = 4;
}

message FriendRemoveReq {
    string request_id = 1;
    string user_id = 2;
    string session_id = 3;
    string peer_id = 4;
}

message FriendRemoveRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3;
}

message FriendAddReq {
    string request_id = 1;
    string session_id = 2;
    string user_id = 3;
    string respondent_id = 4;
}

message FriendAddRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3;
    string notify_event_id = 4;
}

message FriendAddProcessReq {
    string request_id = 1;
    string notify_event_id = 2;
    bool agree = 3;
    string apply_user_id = 4;
    string session_id = 5;
    string user_id = 6;
}

message FriendAddProcessRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3;
    string new_session_id = 4;
}

message GetPendingFriendEventListReq {
    string request_id = 1;
    string session_id = 2;
    string user_id = 3;
}

message FriendEvent {
    string event_id = 1;
    UserInfo sender = 3;
}

message GetPendingFriendEventListRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3;
    repeated FriendEvent event = 4;
}

message FriendSearchReq {
    string request_id = 1;
    string search_key = 2;
    string session_id = 3;
    string user_id = 4;
}

message FriendSearchRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3;
    repeated UserInfo user_info = 4;
}

message GetChatSessionListReq {
    string request_id = 1;
    string session_id = 2;
    string user_id = 3;
}

message GetChatSessionListRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3;
    repeated ChatSessionInfo chat_session_info_list = 4;
}

message ChatSessionCreateReq {
    string request_id = 1;
    string session_id = 2;
    string user_id = 3;
    string chat_session_name = 4;
    repeated string member_id_list = 5;
}

message ChatSessionCreateRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3;
    ChatSessionInfo chat_session_info = 4;
}

message GetChatSessionMemberReq {
    string request_id = 1;
    string session_id = 2;
    string user_id = 3;
    string chat_session_id = 4;
}

message GetChatSessionMemberRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3;
    repeated UserInfo member_info_list = 4;
}

// MessageTransmitServer 使用的内部轻量接口，避免为了取 ID 下载所有头像。
message GetChatSessionMemberIdsReq {
    string request_id = 1;
    string chat_session_id = 2;
}

message GetChatSessionMemberIdsRsp {
    string request_id = 1;
    bool success = 2;
    string errmsg = 3;
    repeated string member_id_list = 4;
}

service FriendService {
    rpc GetFriendList(GetFriendListReq) returns (GetFriendListRsp);
    rpc FriendRemove(FriendRemoveReq) returns (FriendRemoveRsp);
    rpc FriendAdd(FriendAddReq) returns (FriendAddRsp);
    rpc FriendAddProcess(FriendAddProcessReq) returns (FriendAddProcessRsp);
    rpc FriendSearch(FriendSearchReq) returns (FriendSearchRsp);
    rpc GetChatSessionList(GetChatSessionListReq) returns (GetChatSessionListRsp);
    rpc ChatSessionCreate(ChatSessionCreateReq) returns (ChatSessionCreateRsp);
    rpc GetChatSessionMember(GetChatSessionMemberReq) returns (GetChatSessionMemberRsp);
    rpc GetPendingFriendEventList(GetPendingFriendEventListReq) returns (GetPendingFriendEventListRsp);
    rpc GetChatSessionMemberIds(GetChatSessionMemberIdsReq) returns (GetChatSessionMemberIdsRsp);
}
