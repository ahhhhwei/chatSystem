syntax = "proto3";

// 相当于命名空间
package ahwei_im;

// cc 指 C++：主要用于让 protobuf 为 service 定义生成 C++ 的通用 RPC 接口
option cc_generic_services = true;

message UserInfo {
    string user_id = 1;
    string nickname = 2;
    string description = 3;
    string phone = 4;
    bytes avatar = 5;
}

enum MessageType {
    STRING = 0;
    IMAGE = 1;
    FILE = 2;
    SPEECH = 3;
}

message StringMessageInfo {
    string content = 1;
}

message ImageMessageInfo {
    string file_id = 1;
    bytes image_content = 2;
}

// message 相当于结构体，用来描述序列化传输的数据格式
message FileMessageInfo {
    // =1：protobuf 里的字段编号，网络数据里面不会保存字段名字，主要靠“字段编号+类型+数据”识别
    // 一旦发布，不可随意更改，否则可能破坏协议兼容性
    string file_id = 1;
    int64 file_size = 2;
    string file_name = 3;
    bytes file_contents = 4;
}

message SpeechMessageInfo {
    string file_id = 1;
    bytes file_contents = 2;
}

message MessageContent {
    MessageType message_type = 1;
    oneof msg_content {
        StringMessageInfo string_message = 2;
        FileMessageInfo file_message = 3;
        SpeechMessageInfo speech_message = 4;
        ImageMessageInfo image_message = 5;
    }
}

message MessageInfo {
    string message_id = 1;
    string chat_session_id = 2;
    int64 timestamp = 3;
    UserInfo sender = 4;
    MessageContent message = 5;
}

message ChatSessionInfo {
    string single_chat_friend_id = 1;
    string chat_session_id = 2;
    string chat_session_name = 3;
    MessageInfo prev_message = 4;
    bytes avatar = 5;
}

message FileDownloadData {
    string file_id = 1;
    bytes file_content = 2;
}

message FileUploadData {
    string file_name = 1;
    int64 file_size = 2;
    bytes file_content = 3;
}
