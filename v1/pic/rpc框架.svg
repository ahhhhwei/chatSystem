<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 460" width="100%" height="100%">
  <defs>
    <marker id="arrow" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#000000"/>
    </marker>
    <marker id="arrow-grey" viewBox="0 0 10 10" refX="6" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M 0 1 L 10 5 L 0 9 z" fill="#718096"/>
    </marker>
  </defs>

  <rect width="100%" height="100%" fill="#FFFFFF"/>

  <g transform="translate(30, 20)">
    <rect width="310" height="410" rx="6" fill="#FAFAFA" stroke="#000000" stroke-width="2"/>
    <text x="155" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#000000">客户端 (Client)</text>

    <g transform="translate(20, 50)">
      <rect width="270" height="60" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#000000">1. 业务调用</text>
      <text x="15" y="45" font-family="monospace" font-size="12" fill="#000000">result = add(1, 2);</text>
    </g>

    <g transform="translate(20, 150)">
      <rect width="270" height="90" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#000000">2. 客户端存根 (Client Stub)</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#000000">· 序列化: 将方法名 'add'</text>
      <text x="15" y="68" font-family="system-ui, sans-serif" font-size="12" fill="#000000">  与参数 [1, 2] 打包成二进制</text>
    </g>

    <g transform="translate(20, 280)">
      <rect width="270" height="90" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#000000">3. 网络传输模块</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#000000">· 发送请求数据包</text>
      <text x="15" y="68" font-family="system-ui, sans-serif" font-size="12" fill="#718096">· 接收返回结果并反序列化</text>
    </g>
  </g>

  <g transform="translate(460, 20)">
    <rect width="310" height="410" rx="6" fill="#FAFAFA" stroke="#000000" stroke-width="2"/>
    <text x="155" y="25" text-anchor="middle" font-family="system-ui, sans-serif" font-size="15" font-weight="bold" fill="#000000">服务端 (Server)</text>

    <g transform="translate(20, 50)">
      <rect width="270" height="60" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#000000">6. 实际业务服务</text>
      <text x="15" y="45" font-family="monospace" font-size="12" fill="#000000">add(a, b) { return a + b; }</text>
    </g>

    <g transform="translate(20, 150)">
      <rect width="270" height="90" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#000000">5. 服务端存根 (Server Stub)</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#000000">· 反序列化: 解析出 'add' 及其参数</text>
      <text x="15" y="68" font-family="system-ui, sans-serif" font-size="12" fill="#000000">· 调用本地方法后将结果(3)序列化</text>
    </g>

    <g transform="translate(20, 280)">
      <rect width="270" height="90" rx="4" fill="#FFFFFF" stroke="#000000" stroke-width="1.5"/>
      <text x="15" y="25" font-family="system-ui, sans-serif" font-size="13" font-weight="bold" fill="#000000">4. 网络传输模块</text>
      <text x="15" y="48" font-family="system-ui, sans-serif" font-size="12" fill="#000000">· 接收请求并交给 Stub</text>
      <text x="15" y="68" font-family="system-ui, sans-serif" font-size="12" fill="#718096">· 回传响应数据包</text>
    </g>
  </g>

  <line x1="340" y1="315" x2="460" y2="315" stroke="#000000" stroke-width="1.5" marker-end="url(#arrow)"/>
  <text x="400" y="305" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" font-weight="bold" fill="#000000">RPC 请求包</text>

  <line x1="460" y1="345" x2="340" y2="345" stroke="#718096" stroke-width="1.5" stroke-dasharray="4,4" marker-end="url(#arrow-grey)"/>
  <text x="400" y="362" text-anchor="middle" font-family="system-ui, sans-serif" font-size="11" fill="#718096">RPC 响应包 (3)</text>

  <g fill="none" stroke-width="1.5">
    <path d="M 185 130 L 185 160" stroke="#000000" marker-end="url(#arrow)"/>
    <path d="M 185 240 L 185 270" stroke="#000000" marker-end="url(#arrow)"/>
    <path d="M 145 270 L 145 240" stroke="#718096" marker-end="url(#arrow-grey)"/>
    <path d="M 145 160 L 145 130" stroke="#718096" marker-end="url(#arrow-grey)"/>
  </g>

  <g fill="none" stroke-width="1.5">
    <path d="M 615 280 L 615 250" stroke="#000000" marker-end="url(#arrow)"/>
    <path d="M 615 150 L 615 120" stroke="#000000" marker-end="url(#arrow)"/>
    <path d="M 575 120 L 575 150" stroke="#718096" marker-end="url(#arrow-grey)"/>
    <path d="M 575 250 L 575 280" stroke="#718096" marker-end="url(#arrow-grey)"/>
  </g>
</svg>
